<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
    <div class="container-fluid bg-dark w-100 d-flex justify-content-center align-items-center" style="height: 100vh;">
        <h1 class="text-white" style="font-size: 100px;">HH : MM : SS AM</h1>
    </div>
</body>

<script>
    const getDigitalClockTime = ()=>{
        let todayTime = new Date()
        console.log(todayTime);
        // hour
        const hours = todayTime.getHours()
        console.log(hours);

        // minutes
        const minutes = todayTime.getMinutes()
        console.log(minutes);

        // seconds
        const seconds = todayTime.getSeconds()
        console.log(seconds);

        result.innerHTML = result.innerHTML = hours > 12 ? `${hours} : ${minutes} : ${seconds} PM` : `${hours} : ${minutes} : ${seconds} AM`
        setTimeout(() => {
            getDigitalClockTime()
        }, 1000)
          
    }
    getDigitalClockTime()
</script>

</html>
