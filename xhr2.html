<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Profile</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">Random User Profile </h1>

        <div class="text-center mb-4">
            <button class="btn btn-primary btn-lg" onclick="getRandomUser()">Generate Random User</button>
        </div>

        <div class="row justify-content-center">
            <div id="result" class="col-md-8 col-lg-6">

            </div>
        </div>
    </div>

</body>

<script>
    // 1. Create XHR Object
    function getRandomUser() {
        const xhr = new XMLHttpRequest()

        // 2. Open / create the request
        xhr.open("GET", "https://dummyjson.com/users")

        // 3. Send Request
        xhr.send()

        // 4. Track request state
        xhr.onreadystatechange = () => {
            if (xhr.readyState == 4 && xhr.status == 200) {

                const allUsers = JSON.parse(xhr.responseText).users
                console.log(allUsers);

                // Generate random index (0 to 29)
                const randomIndex = Math.floor(Math.random() * allUsers.length)

                // Get one random user
                const user = allUsers[randomIndex]

                
                result.innerHTML = `
                <div class="card shadow-lg">
                    <div class="card-body">

                        <div class="text-center mb-4">
                            <img src="${user.image}"
                                 class="rounded-circle border"
                                 width="150"
                                 height="150">
                        </div>

                        <h2 class="text-center mb-4">
                            ${user.firstName} ${user.lastName}
                        </h2>

                        <table class="table table-bordered">
                            <tr>
                                <th>First Name</th>
                                <td>${user.firstName}</td>
                            </tr>
                            <tr>
                                <th>Last Name</th>
                                <td>${user.lastName}</td>
                            </tr>
                            <tr>
                                <th>Age</th>
                                <td>${user.age}</td>
                            </tr>
                            <tr>
                                <th>Gender</th>
                                <td>${user.gender}</td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td>${user.email}</td>
                            </tr>
                            <tr>
                                <th>Phone</th>
                                <td>${user.phone}</td>
                            </tr>
                            <tr>
                                <th>Username</th>
                                <td>${user.username}</td>
                            </tr>
                            <tr>
                                <th>Date of Birth</th>
                                <td>${user.birthDate}</td>
                            </tr>
                            <tr>
                                <th>Blood Group</th>
                                <td>${user.bloodGroup}</td>
                            </tr>
                        </table>

                    </div>
                </div>
            `

            } else if (xhr.readyState == 4) {
                console.log("API CALL Failed!!!")
            }
        }
    }
   getRandomUser()
    
</script>
</html>
