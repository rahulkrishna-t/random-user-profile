<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Bootstrap -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

    <body class="bg-dark d-flex justify-content-center align-items-center vh-100">
    <div class="card bg-secondary p-3 shadow-lg" style="width: 400px;">

        <!-- Display -->
        <div class="form-control bg-dark text-white text-end mb-4 py-3 fs-2"></div>

        <!-- Buttons -->
        <div class="container-fluid">
            <div class="row g-3">

                <div class="col-3"><button class="btn btn-danger w-100 py-3 fs-4">AC</button></div>
                <div class="col-3"><button class="btn btn-danger w-100 py-3 fs-4">C</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 py-3 fs-4">*</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 py-3 fs-4">-</button></div>

                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4" onclick="callDisplay(`7`)">7</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">8</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">9</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 py-3 fs-4">/</button></div>

                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">4</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">5</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">6</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 py-3 fs-4">+</button></div>

                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">1</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">2</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">3</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">=</button></div>

                <div class="col-6"><button class="btn btn-dark w-100 py-3 fs-4">0</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">00</button></div>
                <div class="col-3"><button class="btn btn-dark w-100 py-3 fs-4">.</button></div>

            </div>
        </div>
    </div>
</body>

<script>

    // display content in screen
    const callDisplay = (content) => {
        result.value += content
    }

    const clearCalDisplay = () => {
        result.value = ""
    }
    const deleteCalDisplay = () => {
        result.value = result.value.slice(0, -1)
    }
    const calcResult = () => {
        try {
        result.value = eval(result.value)
        }catch (error) {
            result.value = "Error!!!"
            console.log(error);
            
        }
    }


</script>
</html>
