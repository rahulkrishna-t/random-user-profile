<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<div>

    <div class="container mt-5">
        <h1 class="text-center">CRUD APPLICATION</h1>

        <div class="mt-5">
            <form id="userForm" class="d-flex justify-content-between gap-2">
                <input id="editIndex" type="hidden" >
                <input id="name" type="text" placeholder="Enter Name" class="form-control">
                <input id="email" type="text" placeholder="Enter Email" class="form-control">
                <button type="submit" class="btn btn-lg btn-primary">Add Data</button>
            </form>
        </div>

        <table id="tableBody" class="table mt-5">
            <thead>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </thead>

            <tbody id="tableBody">
                
            </tbody>
        </table>
    </div>
</div>

</body>

<script>

    let users = []

    // form
    const form = document.getElementById("userForm")

    // tablebody
    const tableBody = document.getElementById("tableBody")

    // edit input index
    const editIndexInput = document.getElementById("editIndex")

    if(sessionStorage.getItem("users")) {
        users = JSON.parse(sessionStorage.getItem("users"))
        displayusers()
    }

    // Add
    form.addEventListener("submit", (e) => {
        e.preventDefault()

        const name = document.getElementById("name").value
        const email = document.getElementById("email").value

        if(editIndexInput.value == "") {
             // add name & email to users
        users.push({name,email })
        } else {
            users[editIndexInput.value] = {name, email}
            editIndexInput.value = ""
        }

        sessionStorage.setItem("users", JSON.stringify(users))
        form.reset()
        console.log(users);
        displayusers()
    })

    // Get
    function displayusers() {
        tableBody.innerHTML = ""
        users.forEach((user, index) => {
            tableBody.innerHTML += 
            `<tr> 
                    <td>${index + 1}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td class="d-flex gap-3">
                        <button onClick="editUser(${index})" class="btn btn-warning">Edit</button>
                        <button onClick="deleteUser(${index})" class="btn btn-danger">Delete</button>
                    </td>
                </tr>
                `
       })
    }

    // Update
    const editUser = (index)=>{
        document.getElementById("name").value = users[index].name
        document.getElementById("email").value = users[index].email
        editIndexInput.value = index
        console.log();
        
    }

    // Delete
    const deleteUser = (index) => {
        if (confirm(`Are you sure, Do you want to delete the user!!!`)) {
            users.splice(index, 1)
            sessionStorage.setItem("users", JSON.stringify(users))
            displayusers()
        }
    }

</script>

</html>
