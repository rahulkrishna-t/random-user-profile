<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-lg-3"></div>
            <div class="col-lg-6 mt-5">
                <h1 class="text-center text-success">Check Vote Eligibility</h1>
                <div class="d-flex gap-1">
                    <input id="userInput" type="text" placeholder="Enter your Age!!!" class="form-control">
                    <button class="btn btn-outline-success" onclick="checkEligibility()">Check</button>
                </div>
                <h1 class="text-success">Eligible for Voting</h1>
            </div>
            <div class="col-lg-3"></div>
        </div>
    </div>
</body>

<script>
    const checkEligibility = () => {

        console.log(userInput.value);
        const age = userInput.value

        if (age) {
            alert(age >= 18 ? 'Eligible for Voting' : 'Not Eligible for Voting')
        } else {
            alert('Enter Valid Age')
        }

    }
</script>

</html>
