<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHR - TODO LIST</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="text-center my-5">TODO LIST</h1>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>User ID</th>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="result">
                <tr>
                    <td>#</td>
                    <td>User ID</td>
                    <td>ID</td>
                    <td>Title</td>
                    <td>Status</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

<script>
    // 1. Create XHR Object
    const xhr = new XMLHttpRequest()

    // 2. Open / create the request - use open(http request, url) method
    xhr.open("GET", "https://jsonplaceholder.typicode.com/todos")

    // 3. send request: use send method
    xhr.send()

    // 4. Track request state: use "readyState" property, its values varies from 1 to 4.
    // if readyState becomes 4 then client received the responses.
    // check its status is in 2xx series the client request becomes successful.
    // to get server response use "responseText" of xhr.
    xhr.onreadystatechange = () => {
        if (xhr.readyState == 4 && xhr.status == 200) {

            // console.log(xhr.responseText);
            const allTodo = JSON.parse(xhr.responseText)
            console.log(allTodo);
            allTodo.forEach((todo, index) => {
                result.innerHTML +=
                    `<tr>
            <td>${index + 1}</td>
            <td>${todo.userId}</td>
            <td>${todo.id}</td>
            <td>${todo.title}</td>
            <td>${todo.completed ? "Completed" : "Not Completed"}</td>
        </tr>`
            })
        } else {
            console.log(`API CALL Failed!!!`);
        }
    }
</script>

</html>
